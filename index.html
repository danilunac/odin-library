<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Odin Library</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="library">
            <h1>My Library</h1>
            <div class="books-grid">
                <div class="book-card">
                    <h4>Cien años de soledad</h4>
                    <p>Gabriel García Márquez</p>
                    <p>Novela</p>
                    <p>800 págs</p>
                    <p>Leído</p>
                </div>
            </div>
            <div class="books-sidebar">
                <form action="index.html" class="form-books" method="post">
                    <fieldset>
                        <legend class="form-legend">Add book</legend>
                        <div class="form-row">
                            <label class="form-label" for="book_title">Title</label>
                            <input class="form-input" id="book_title" type="text">
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="book_author">Author</label>
                            <input class="form-input" id="book_author" type="text">
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="book_genre">Genre</label>
                            <input class="form-input" id="book_genre" type="text">
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="book_pages">Pages</label>
                            <input class="form-input" id="book_pages" type="number">
                        </div>
                        <button class="form-btn">Save</button>
                    </fieldset>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
