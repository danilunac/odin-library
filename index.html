<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Odin Library</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="library">
            <h1>My Library</h1>
            <div class="books-grid">
                <div class="book-card">
                    <h4>Cien años de soledad</h4>
                    <p>Gabriel García Márquez</p>
                    <p>Novela</p>
                    <p>800 págs</p>
                    <p>Leído</p>
                </div>
                <div class="book-card">
                    <h4>Oliver Twist</h4>
                    <p>Charles Dickens</p>
                    <p>Novela</p>
                    <p>1200 págs</p>
                    <p>No leído</p>
                </div>
                <div class="book-card">
                    <h4>El mundo de ayer</h4>
                    <p>Stefan Zweig</p>
                    <p>Biografía</p>
                    <p>950 págs</p>
                    <p>Leído</p>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
